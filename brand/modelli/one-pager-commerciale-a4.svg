<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="#F4F7FA"/><text x="80" y="100" fill="#0B0D10" font-family="Inter,Arial" font-size="38" font-weight="900">CHIUDI<tspan fill="#A8C800">.</tspan></text><text x="80" y="255" fill="#0B0D10" font-family="Inter Display,Inter,Arial" font-size="76" font-weight="850" letter-spacing="-4"><tspan x="80" dy="0">Riapri i preventivi</tspan><tspan x="80" dy="82">rimasti in sospeso.</tspan></text><text x="80" y="475" fill="#4E5964" font-family="Inter,Arial" font-size="28"><tspan x="80" dy="0">Prima di comprare nuovi lead, capiamo quanti soldi</tspan><tspan x="80" dy="40">sono già fermi nella pipeline.</tspan></text><rect x="80" y="590" width="1080" height="280" rx="26" fill="#0B0D10"/><text x="125" y="660" fill="#98A3AE" font-family="Inter,Arial" font-size="18" font-weight="800">IL CRUSCOTTO</text><text x="125" y="750" fill="#F4F7FA" font-family="Inter,Arial" font-size="62" font-weight="900">€ 184.300</text><text x="125" y="800" fill="#C4CDD5" font-family="Inter,Arial" font-size="22">di preventivi ancora aperti</text><circle cx="1085" cy="730" r="30" fill="#D8FF46"/><text x="80" y="990" fill="#0B0D10" font-family="Inter,Arial" font-size="24" font-weight="850">01 · IMPORTA</text><text x="80" y="1040" fill="#4E5964" font-family="Inter,Arial" font-size="23">CSV o export gestionale.</text><text x="80" y="1140" fill="#0B0D10" font-family="Inter,Arial" font-size="24" font-weight="850">02 · DAI PRIORITÀ</text><text x="80" y="1190" fill="#4E5964" font-family="Inter,Arial" font-size="23">Valore, età, prossimo follow-up e stato.</text><text x="80" y="1290" fill="#0B0D10" font-family="Inter,Arial" font-size="24" font-weight="850">03 · RIAPRI</text><text x="80" y="1340" fill="#4E5964" font-family="Inter,Arial" font-size="23">Messaggio utile, risposta, passaggio al commerciale.</text><rect x="80" y="1480" width="1080" height="170" rx="24" fill="#E9F0C4"/><text x="120" y="1550" fill="#0B0D10" font-family="Inter,Arial" font-size="30" font-weight="850">La domanda non è “quanti lead ci servono?”</text><text x="120" y="1600" fill="#4E5964" font-family="Inter,Arial" font-size="24">È: “quante opportunità abbiamo già pagato e lasciato ferme?”</text></svg>